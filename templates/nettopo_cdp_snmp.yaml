zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 3470b2f4799f40cc8a01a67f7df32f9c
    name: Templates/Network devices
  templates:
  - uuid: 947f9a283d684ca796cc7be6ba4bb223
    template: Network Topology CDP by SNMP
    name: Network Topology CDP by SNMP
    description: |
      Network Topology (nettopo) - CDP neighbors by SNMP.

      Collects the CDP neighbor table and publishes it as JSON in the item "nettopo.cdp.neighbors",
      which the Zabbix frontend module "Network Topology" uses to draw links between hosts.
      Each neighbor is also discovered (LLD) so a lost neighbor is detected and can raise a problem.

      Walked: CISCO-CDP-MIB cdpCacheTable; IF-MIB ifName, ifDescr.

      Macros:
      {$NETTOPO.INTERVAL} - polling interval of the neighbor table.
      {$NETTOPO.LOST.KEEP} - how long a lost neighbor is kept (shown as a down link) before it is removed.
      {$NETTOPO.LOST.ALERT} - set to 0 to stop the "neighbor lost" problems (links are still drawn as down).
    vendor:
      name: nettopo
      version: '1.0'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: d3332399c87a43059328813bc271a460
      name: 'CDP: neighbor table (raw walk)'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.9.9.23.1.2.1.1.3,1.3.6.1.4.1.9.9.23.1.2.1.1.4,1.3.6.1.4.1.9.9.23.1.2.1.1.6,1.3.6.1.4.1.9.9.23.1.2.1.1.7,1.3.6.1.4.1.9.9.23.1.2.1.1.8,1.3.6.1.4.1.9.9.23.1.2.1.1.9,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2]
      key: nettopo.cdp.walk
      delay: '{$NETTOPO.INTERVAL}'
      history: '0'
      value_type: TEXT
      description: Raw SNMP walk of the CDP tables. Not stored, used as master item.
      tags:
      - tag: component
        value: topology
    - uuid: 3e003b55a69b4970aca000b5f5bf45e0
      name: 'CDP: neighbors'
      type: DEPENDENT
      key: nettopo.cdp.neighbors
      delay: '0'
      history: 7d
      value_type: TEXT
      description: |
        Current CDP neighbors as a JSON array (read by the Network Topology module).
        Fields: k=key, lp=local port, li=local ifIndex, rn=remote name, rc=remote chassis ID,
        rp=remote port, rpd=remote port description, ra=remote management IPs, rd=remote description,
        cap=remote capabilities.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          // Network Topology (nettopo) - CDP neighbors from SNMP walk[] output (CISCO-CDP-MIB cdpCacheTable).
          // Zabbix JavaScript preprocessing (Duktape, ES5 only). Output: JSON array, same fields as the LLDP item.
          var MAX_JSON = 60000;

          function parseWalk(text) {
              var out = {}, i = 0, n = text.length, c, s, oid, m, type, val, e, nl;

              while (i < n) {
                  c = text.charAt(i);
                  if (c === '\n' || c === '\r' || c === ' ' || c === '\t') {
                      i++;
                      continue;
                  }

                  s = i;
                  while (i < n && '0123456789.'.indexOf(text.charAt(i)) !== -1) {
                      i++;
                  }
                  oid = text.substring(s, i);
                  while (i < n && text.charAt(i) === ' ') {
                      i++;
                  }

                  if (oid === '' || text.charAt(i) !== '=') {
                      nl = text.indexOf('\n', i);
                      i = nl < 0 ? n : nl + 1;
                      continue;
                  }

                  if (oid.charAt(0) === '.') {
                      oid = oid.substring(1);
                  }

                  i++;
                  while (i < n && text.charAt(i) === ' ') {
                      i++;
                  }

                  type = '';
                  m = /^([A-Za-z][A-Za-z0-9\-]*):/.exec(text.substring(i, i + 40));
                  if (m) {
                      type = m[1];
                      i += m[0].length;
                      while (i < n && text.charAt(i) === ' ') {
                          i++;
                      }
                  }

                  if (text.charAt(i) === '"') {
                      e = i + 1;
                      while (e < n) {
                          c = text.charAt(e);
                          if (c === '\\') {
                              e += 2;
                              continue;
                          }
                          if (c === '"') {
                              break;
                          }
                          e++;
                      }
                      val = text.substring(i + 1, e).replace(/\\(.)/g, '$1');
                      nl = text.indexOf('\n', e);
                      i = nl < 0 ? n : nl + 1;
                  }
                  else if (type === 'Hex-STRING' || type === 'BITS') {
                      e = i;
                      while (true) {
                          nl = text.indexOf('\n', e);
                          if (nl < 0) {
                              e = n;
                              break;
                          }
                          if (text.charAt(nl + 1) === '.' || /^[0-9]+(\.[0-9]+)+ *=/.test(text.substring(nl + 1, nl + 200))) {
                              e = nl;
                              break;
                          }
                          e = nl + 1;
                      }
                      val = text.substring(i, e).replace(/\s+/g, ' ').replace(/^ +| +$/g, '');
                      i = e + 1;
                  }
                  else {
                      nl = text.indexOf('\n', i);
                      e = nl < 0 ? n : nl;
                      val = text.substring(i, e).replace(/\s+$/, '');
                      i = e + 1;
                  }

                  out[oid] = {t: type, v: val};
              }

              return out;
          }

          function hexBytes(v) {
              var parts = v.split(' '), bytes = [], k;

              for (k = 0; k < parts.length; k++) {
                  if (/^[0-9A-Fa-f]{2}$/.test(parts[k])) {
                      bytes.push(parseInt(parts[k], 16));
                  }
                  else if (parts[k] !== '') {
                      break;
                  }
              }

              return bytes;
          }

          function asText(cell) {
              var bytes, r = '', k;

              if (!cell) {
                  return '';
              }
              if (cell.t === 'Hex-STRING') {
                  bytes = hexBytes(cell.v);
                  for (k = 0; k < bytes.length; k++) {
                      if (bytes[k] >= 32 && bytes[k] < 127) {
                          r += String.fromCharCode(bytes[k]);
                      }
                  }

                  return r.replace(/^\s+|\s+$/g, '');
              }

              return String(cell.v).replace(/^\s+|\s+$/g, '');
          }

          // cdpCacheAddress: 4 octets for IPv4. Zabbix may print it as Hex-STRING or (when printable) as STRING.
          function asIp(cell) {
              var bytes = [], k;

              if (!cell) {
                  return '';
              }
              if (cell.t === 'Hex-STRING') {
                  bytes = hexBytes(cell.v);
              }
              else if (cell.t === 'IpAddress') {
                  return cell.v;
              }
              else {
                  for (k = 0; k < cell.v.length; k++) {
                      bytes.push(cell.v.charCodeAt(k) & 0xFF);
                  }
              }

              return bytes.length === 4 ? bytes.join('.') : '';
          }

          // cdpCacheCapabilities (4 octets bitmask): 0x01 router, 0x02 TB bridge, 0x04 SR bridge, 0x08 switch,
          // 0x10 host, 0x20 IGMP, 0x40 repeater, 0x80 phone (VoIP), 0x100 remotely managed device.
          function asCaps(cell) {
              var bytes, mask = 0, caps = [], k;

              if (!cell) {
                  return '';
              }
              bytes = cell.t === 'Hex-STRING' ? hexBytes(cell.v) : [];
              for (k = 0; k < bytes.length; k++) {
                  mask = (mask * 256) + bytes[k];
              }
              if (mask & 0x01) { caps.push('router'); }
              if (mask & 0x0E) { caps.push('bridge'); }
              if (mask & 0x10) { caps.push('station'); }
              if (mask & 0x40) { caps.push('repeater'); }
              if (mask & 0x80) { caps.push('telephone'); }

              return caps.join(',');
          }

          function sanitizeKey(s) {
              return String(s).replace(/[^A-Za-z0-9._:\/\-]/g, '_').substring(0, 160);
          }

          function truncate(s, len) {
              s = String(s).replace(/[\r\n\t]+/g, ' ').replace(/\s{2,}/g, ' ');

              return s.length > len ? s.substring(0, len - 1) + '…' : s;
          }

          var W = parseWalk(value);

          var P_CDP = '1.3.6.1.4.1.9.9.23.1.2.1.1.',
              P_IFNAME = '1.3.6.1.2.1.31.1.1.1.1.',
              P_IFDESCR = '1.3.6.1.2.1.2.2.1.2.';

          var cache = {}, ifName = {}, ifDescr = {}, oid, rest, dot, col, idx;

          for (oid in W) {
              if (!W.hasOwnProperty(oid)) {
                  continue;
              }
              if (oid.indexOf(P_CDP) === 0) {
                  rest = oid.substring(P_CDP.length);
                  dot = rest.indexOf('.');
                  col = rest.substring(0, dot);
                  idx = rest.substring(dot + 1);
                  if (!cache[idx]) {
                      cache[idx] = {};
                  }
                  cache[idx][col] = W[oid];
              }
              else if (oid.indexOf(P_IFNAME) === 0) {
                  ifName[oid.substring(P_IFNAME.length)] = asText(W[oid]);
              }
              else if (oid.indexOf(P_IFDESCR) === 0) {
                  ifDescr[oid.substring(P_IFDESCR.length)] = asText(W[oid]);
              }
          }

          var keys = [];
          for (idx in cache) {
              if (cache.hasOwnProperty(idx)) {
                  keys.push(idx);
              }
          }
          keys.sort(function(a, b) {
              var pa = a.split('.'), pb = b.split('.');

              return (parseInt(pa[0], 10) - parseInt(pb[0], 10)) || (parseInt(pa[1], 10) - parseInt(pb[1], 10));
          });

          var list = [], seen = {};

          for (var r = 0; r < keys.length; r++) {
              idx = keys[r];
              var e = cache[idx], ifindex = idx.split('.')[0], nb = {},
                  device = asText(e['6']), port = asText(e['7']), ip = '';

              if (device === '' && port === '') {
                  continue;
              }
              // cdpCacheAddressType 1 = ip
              if (!e['3'] || /(^|\()1\)?$/.test(String(e['3'].v)) || String(e['3'].v) === '1') {
                  ip = asIp(e['4']);
              }

              nb.k = sanitizeKey('cdp_' + ifindex + '_' + device + '_' + port);
              if (seen[nb.k]) {
                  continue;
              }
              seen[nb.k] = true;

              nb.li = ifindex;
              nb.lp = ifName[ifindex] || ifDescr[ifindex] || ifindex;
              if (device !== '') {
                  nb.rn = truncate(device, 128);
              }
              if (port !== '') {
                  nb.rp = truncate(port, 128);
              }
              if (ip !== '') {
                  nb.ra = [ip];
              }

              var platform = asText(e['8']);
              if (platform !== '') {
                  nb.rd = truncate(platform, 100);
              }

              var caps = asCaps(e['9']);
              if (caps !== '') {
                  nb.cap = caps;
              }

              list.push(nb);
          }

          var json = JSON.stringify(list);

          while (json.length > MAX_JSON && list.length > 0) {
              list.pop();
              json = JSON.stringify(list);
          }

          return json;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: nettopo.cdp.walk
      tags:
      - tag: component
        value: topology
    discovery_rules:
    - uuid: d19d50d7e87141b38a994e2da5a78a7b
      name: CDP neighbors discovery
      type: DEPENDENT
      key: nettopo.cdp.discovery
      delay: '0'
      lifetime_type: DELETE_AFTER
      lifetime: '{$NETTOPO.LOST.KEEP}'
      enabled_lifetime_type: DISABLE_NEVER
      description: One entity per CDP neighbor. Lost neighbors are kept for {$NETTOPO.LOST.KEEP}.
      item_prototypes:
      - uuid: 3fa15fa5059840aab82b7ed704d3589e
        name: CDP neighbor {#NT.REMOTE.NAME} ({#NT.REMOTE.PORT}) on {#NT.LOCAL.PORT}
        type: DEPENDENT
        key: nettopo.cdp.neighbor[{#NT.KEY}]
        delay: '0'
        history: 7d
        trends: '0'
        value_type: UNSIGNED
        valuemap:
          name: nettopo neighbor state
        description: 1 = neighbor present, 0 = neighbor no longer seen on this port.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.k == "{#NT.KEY}")].length()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        master_item:
          key: nettopo.cdp.neighbors
        tags:
        - tag: component
          value: topology
        - tag: nt.ifindex
          value: '{#NT.LOCAL.IFINDEX}'
        - tag: nt.local
          value: '{#NT.LOCAL.PORT}'
        - tag: nt.proto
          value: cdp
        - tag: nt.rchassis
          value: '{#NT.REMOTE.CHASSIS}'
        - tag: nt.remote
          value: '{#NT.REMOTE.NAME}'
        - tag: nt.rip
          value: '{#NT.REMOTE.IP}'
        - tag: nt.rport
          value: '{#NT.REMOTE.PORT}'
        trigger_prototypes:
        - uuid: 03bb1ddabaee4ec196acab450ed7ac4a
          expression: last(/Network Topology CDP by SNMP/nettopo.cdp.neighbor[{#NT.KEY}])=0 and {$NETTOPO.LOST.ALERT}=1
          name: 'CDP: neighbor {#NT.REMOTE.NAME} lost on {#NT.LOCAL.PORT}'
          opdata: 'Remote port: {#NT.REMOTE.PORT}'
          priority: WARNING
          description: The CDP neighbor is no longer seen on this port (link down, cable moved or neighbor replaced).
          manual_close: 'YES'
          tags:
          - tag: nettopo
            value: lost
          - tag: scope
            value: availability
      master_item:
        key: nettopo.cdp.neighbors
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          // Network Topology (nettopo) - converts the neighbors JSON into LLD rows (one per neighbor).
          var list = JSON.parse(value), rows = [], k, n, name, port;

          for (k = 0; k < list.length; k++) {
              n = list[k];
              name = n.rn || n.rc || (n.ra && n.ra.length ? n.ra[0] : '') || 'unknown';
              port = n.rp || '';

              // A MAC address as remote port ID is not human friendly, prefer the port description.
              if (n.rpd && (port === '' || /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/i.test(port))) {
                  port = n.rpd;
              }

              rows.push({
                  '{#NT.KEY}': n.k,
                  '{#NT.LOCAL.PORT}': n.lp || n.lpn || '',
                  '{#NT.LOCAL.IFINDEX}': n.li || '',
                  '{#NT.REMOTE.NAME}': name,
                  '{#NT.REMOTE.PORT}': port,
                  '{#NT.REMOTE.CHASSIS}': n.rc || '',
                  '{#NT.REMOTE.IP}': (n.ra && n.ra.length) ? n.ra[0] : ''
              });
          }

          return JSON.stringify(rows);
    tags:
    - tag: class
      value: network
    - tag: target
      value: topology
    macros:
    - macro: '{$NETTOPO.INTERVAL}'
      value: 5m
      description: Polling interval of the neighbor table.
    - macro: '{$NETTOPO.LOST.ALERT}'
      value: '1'
      description: Set to 0 to disable the "neighbor lost" trigger.
    - macro: '{$NETTOPO.LOST.KEEP}'
      value: 7d
      description: How long a lost neighbor is kept (drawn as a down link) before being removed.
    valuemaps:
    - uuid: d7fb9aa1d1a445bdbe5629f67e6a04b2
      name: nettopo neighbor state
      mappings:
      - value: '0'
        newvalue: Lost
      - value: '1'
        newvalue: Present
